services:
  gestor_gastos_app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gestor_gastos_app
    container_name: gestor_gastos_app
    restart: 'no'
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - gestor_gastos_db
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@gestor_gastos_db:3306/${MYSQL_DATABASE}?serverVersion=8.4&charset=utf8mb4"
    networks:
      - gestor_gastos
    ports:
      - "${APP_PORT}:80"

  gestor_gastos_db:
    image: mysql:8.4
    container_name: gestor_gastos_db
    restart: 'no'
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - gestor_gastos

volumes:
  db_data:

networks:
  gestor_gastos:
    driver: bridge
